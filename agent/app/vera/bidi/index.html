<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Vera — B1.a Audio test</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 4rem auto; padding: 1rem; background: #0b1018; color: #e6eaf2; }
    h1 { font-weight: 300; }
    button { font-size: 1rem; padding: 0.6rem 1.4rem; border: 1px solid #475569; background: #1e293b; color: #e6eaf2; border-radius: 0.5rem; cursor: pointer; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:hover:not(:disabled) { background: #334155; }
    #status { margin-top: 1.5rem; padding: 1rem; background: #1e293b; border-radius: 0.5rem; min-height: 3rem; font-family: monospace; font-size: 0.9rem; }
    #log { margin-top: 1rem; padding: 1rem; background: #0f172a; border-radius: 0.5rem; max-height: 240px; overflow-y: auto; font-family: monospace; font-size: 0.8rem; color: #94a3b8; }
    .ok { color: #34d399; } .err { color: #f87171; } .info { color: #5eead4; }
  </style>
</head>
<body>
  <h1>Vera · prueba de voz B1.a</h1>
  <button id="start">▶ iniciar conversación</button>
  <button id="stop" disabled>■ detener</button>
  <div id="status">listo · poné auriculares antes de iniciar</div>
  <div id="log"></div>

<script>
const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');

let ws, audioCtx, micStream, processor, source;
let playbackTime = 0;

function log(msg, cls='info') {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function status(msg) { statusEl.textContent = msg; }

// Convert Float32 [-1, 1] to Int16 PCM (Nova Sonic expects 16-bit PCM @ 16kHz)
function floatTo16BitPCM(float32) {
  const buf = new ArrayBuffer(float32.length * 2);
  const view = new DataView(buf);
  for (let i = 0; i < float32.length; i++) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return buf;
}

// Decode Int16 PCM @ 24kHz to Float32 for Web Audio playback
function int16ToFloat32(int16) {
  const out = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) out[i] = int16[i] / 0x8000;
  return out;
}

async function start() {
  startBtn.disabled = true;
  status('pidiendo permiso de micrófono…');

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        sampleRate: 16000,
        channelCount: 1,
      }
    });
    log('micrófono OK', 'ok');
  } catch (e) {
    log(`micrófono falló: ${e.message}`, 'err');
    status('error de micrófono');
    startBtn.disabled = false;
    return;
  }

  // 16 kHz for input, 24 kHz output handled by playback math
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  playbackTime = audioCtx.currentTime;

  ws = new WebSocket(`ws://${location.host}/ws`);

  ws.onopen = () => {
    log('WebSocket conectado', 'ok');
    status('conectado · hablá');
    stopBtn.disabled = false;

    // Send mic audio to server in real time
    source = audioCtx.createMediaStreamSource(micStream);
    processor = audioCtx.createScriptProcessor(4096, 1, 1);
    source.connect(processor);
    processor.connect(audioCtx.destination);

    processor.onaudioprocess = (e) => {
      if (ws.readyState !== WebSocket.OPEN) return;
      const float32 = e.inputBuffer.getChannelData(0);
      const pcm16 = floatTo16BitPCM(float32);
      const b64 = btoa(String.fromCharCode(...new Uint8Array(pcm16)));
      ws.send(JSON.stringify({ type: 'audio', data: b64 }));
    };
  };

  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'audio') {
      // Decode PCM16 @ 24kHz and play
      const raw = atob(msg.data);
      const int16 = new Int16Array(raw.length / 2);
      for (let i = 0; i < int16.length; i++) {
        int16[i] = (raw.charCodeAt(i*2)) | (raw.charCodeAt(i*2+1) << 8);
        if (int16[i] >= 0x8000) int16[i] -= 0x10000;
      }
      const float32 = int16ToFloat32(int16);
      // Nova Sonic outputs at 24kHz; create buffer at that rate
      const buf = audioCtx.createBuffer(1, float32.length, 24000);
      buf.getChannelData(0).set(float32);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      const t = Math.max(audioCtx.currentTime, playbackTime);
      src.start(t);
      playbackTime = t + buf.duration;
    } else if (msg.type === 'text') {
      log(`Vera: "${msg.data}"`, 'info');
    }
  };

  ws.onerror = (e) => { log(`WS error`, 'err'); };
  ws.onclose = () => { log('WS cerrado'); status('desconectado'); stopBtn.disabled = true; startBtn.disabled = false; };
}

function stop() {
  if (processor) { processor.disconnect(); processor = null; }
  if (source) { source.disconnect(); source = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (ws) { ws.send(JSON.stringify({ type: 'end' })); ws.close(); ws = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  log('detenido', 'info');
}

startBtn.onclick = start;
stopBtn.onclick = stop;
</script>
</body>
</html>
